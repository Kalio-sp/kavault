server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Глобальные заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, must-revalidate, max-age=3600";
        add_header Content-Disposition "attachment";
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe;
            application/zip zip;
        }
    }

    # Проксирование API бэкенда через порт 80 (работает на мобильных сетях и без CORS)
    location ~ ^/(auth|japanese|resources|social|admin|thoughts|decks|stats|users) {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50m;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Кеширование статики и медиа (включая mp4/mp3 для стабильного буферизирования на iOS)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|mp4|webm|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
