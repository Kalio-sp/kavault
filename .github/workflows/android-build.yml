name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kavault-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd kavault-frontend
          npm ci

      - name: Build Frontend Web Assets
        run: |
          cd kavault-frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd kavault-frontend
          npx cap sync android

      - name: Build Android APK via Gradle
        run: |
          cd kavault-frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish KAVAULT APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp kavault-frontend/android/app/build/outputs/apk/debug/app-debug.apk KAVAULT.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest KAVAULT.apk --clobber
          else
            gh release create latest KAVAULT.apk --title "KAVAULT Latest" --notes "Automated KAVAULT build"
          fi
